name: Build unsigned iOS IPA

# 这个文件需要放在仓库根目录的 .github/workflows/ 下：
#   <仓库根>/.github/workflows/ios-unsigned-ipa.yml
#
# 工作流会自动寻找仓库里的 project.yml（无论它是
#   ios-app/ios/project.yml、ios/project.yml 还是根目录的 project.yml），
# 然后生成 Xcode 工程并构建未签名 IPA。
# 产物：ResourceApp-unsigned.ipa（需要自行用 Sideloadly / AltStore / TrollStore / 企业证书签名安装）

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "可选：手动指定构建号（默认使用 run_number）"
        required: false
        default: ""
  push:
    branches:
      - main
      - master
    paths:
      - "**/*.swift"
      - "**/project.yml"
      - "**/Assets.xcassets/**"
      - ".github/workflows/**"

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-14
    timeout-minutes: 45

    env:
      SCHEME: ResourceApp
      APP_NAME: ResourceApp
      BUNDLE_ID: com.appku.top
      BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate iOS project
        run: |
          set -euo pipefail

          SPEC=""
          while IFS= read -r candidate; do
            dir="$(dirname "$candidate")"
            if [ -d "$dir/ResourceApp" ]; then
              SPEC="$candidate"
              break
            fi
          done < <(find . -name project.yml -not -path './.git/*' -print)

          if [ -z "$SPEC" ]; then
            SPEC="$(find . -name project.yml -not -path './.git/*' -print -quit)"
          fi

          if [ -z "$SPEC" ]; then
            echo "::error::仓库里找不到 project.yml。请把 ios-app/ios 目录（包含 project.yml 和 ResourceApp 文件夹）上传到仓库。"
            echo ""
            echo "当前仓库文件（最多 120 项）："
            find . -maxdepth 3 -not -path './.git*' -print | sort | head -n 120
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC")"

          if [ ! -d "$PROJECT_DIR/ResourceApp" ]; then
            echo "::error::$PROJECT_DIR 下缺少 ResourceApp 源码目录，请检查上传的文件结构。"
            find . -maxdepth 3 -not -path './.git*' -print | sort | head -n 120
            exit 1
          fi

          echo "找到工程配置：$SPEC"
          echo "工程目录：$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodegen generate --spec project.yml
          ls -la

      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          xcodebuild \
            -project "${SCHEME}.xcodeproj" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            MARKETING_VERSION="1.0.0" \
            CURRENT_PROJECT_VERSION="${BUILD_NUMBER}" \
            PRODUCT_BUNDLE_IDENTIFIER="${BUNDLE_ID}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build 2>&1 | tee build.log

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APP_PATH="build/Build/Products/Release-iphoneos/${APP_NAME}.app"

          if [ ! -d "${APP_PATH}" ]; then
            echo "未找到构建产物：${APP_PATH}"
            find build/Build/Products -maxdepth 3 -name "*.app" -print || true
            exit 1
          fi

          rm -rf Payload "${APP_NAME}-unsigned.ipa"
          mkdir -p Payload
          cp -R "${APP_PATH}" "Payload/${APP_NAME}.app"

          # 未签名包不应该携带签名文件，避免签名工具误判
          rm -rf "Payload/${APP_NAME}.app/_CodeSignature" || true
          rm -f "Payload/${APP_NAME}.app/embedded.mobileprovision" || true

          zip -qry "${APP_NAME}-unsigned.ipa" Payload

          ls -lh "${APP_NAME}-unsigned.ipa"
          echo "IPA_PATH=${PWD}/${APP_NAME}-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ResourceApp-unsigned-ipa-${{ env.BUILD_NUMBER }}
          path: "**/ResourceApp-unsigned.ipa"
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.BUILD_NUMBER }}
          path: "**/build.log"
          if-no-files-found: ignore
          retention-days: 7
