name: ResourceApp
options:
  bundleIdPrefix: com.appku
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # 生成 Xcode 15 可读的工程格式，避免 CI 的 Xcode 15.4 打不开 Xcode 16 格式（objectVersion 77）
  xcodeVersion: "15.3"
  projectFormat: xcode15_3

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ResourceApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ResourceApp
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: ResourceApp
        PRODUCT_BUNDLE_IDENTIFIER: com.appku.top
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: ResourceApp/Info.plist
      properties:
        CFBundleDisplayName: 资源库
        CFBundleName: ResourceApp
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Automatic
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true

schemes:
  ResourceApp:
    build:
      targets:
        ResourceApp: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
